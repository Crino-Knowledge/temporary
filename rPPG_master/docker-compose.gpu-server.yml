version: '3.8'

services:
  # GPU加速后端服务
  rppg-backend-gpu:
    build:
      context: .
      dockerfile: deployment/Dockerfile.gpu-backend
    container_name: rppg-backend-gpu
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - HOST=0.0.0.0
      - PORT=5000
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./backend:/app
      - ./logs:/var/log
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    restart: unless-stopped
    networks:
      - rppg-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  rppg-frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
      args:
        - VUE_APP_API_BASE_URL=/api
        - VUE_APP_WS_URL=/
        - VUE_APP_TITLE=rPPG实时心率监测系统
        - NODE_ENV=production
        - VUE_APP_DEBUG=false
    container_name: rppg-frontend
    ports:
      - "80:80"
    depends_on:
      - rppg-backend-gpu
    restart: unless-stopped
    networks:
      - rppg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: rppg-nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - rppg-frontend
      - rppg-backend-gpu
    restart: unless-stopped
    networks:
      - rppg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  rppg-network:
    driver: bridge

volumes:
  logs:
    driver: local